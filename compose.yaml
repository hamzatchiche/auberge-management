
services:

  backend:
    build:
      context: ./azurea_back
      dockerfile: Dockerfile
    container_name: azuveria-backend
    ports:
      - "8000:80"
    env_file:
      - ./azurea_back/.env
    volumes:
      - ./azurea_back:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    networks:
      - azuveria-network

  frontend:
    build:
      context: ./azurea_front
      dockerfile: Dockerfile
    container_name: azuveria-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./azurea_front/.env
    volumes:
      - ./azurea_front:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - azuveria-network

  database:
    image: mysql:8.0
    container_name: azuveria-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: azuveria
      MYSQL_USER: azuveria_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - azuveria-network

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:

networks:
  azuveria-network:
    driver: bridge
